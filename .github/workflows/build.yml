# ─────────────────────────────────────────────────────────────
# 🏗️ Build — app (Vite) + Storybook
# ─────────────────────────────────────────────────────────────
name: Build
run-name: "🏗️ [${{ github.workflow }} #${{ github.run_number }}] ${{ github.head_ref || github.ref_name }} by @${{ github.actor }}"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "build-${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build app + Storybook
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "[1/4] Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: "[2/4] Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "[3/4] Install"
        run: npm ci

      - name: "[4/4] Build app + Storybook"
        run: |
          npm run build
          npm run build-storybook
