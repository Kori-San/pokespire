<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pokespire — design canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #283058;
    font-family: 'Pixelify Sans', monospace;
    color: #f8f8f8;
  }
  * { image-rendering: pixelated; -webkit-font-smoothing: none; }
  /* Force pixelated text rendering for the GBA feel */
  body { font-feature-settings: normal; text-rendering: geometricPrecision; }
</style>
</head>
<body>
<div id="root"></div>

<script src="src/data.js"></script>
<script type="text/babel" src="src/ui.jsx"></script>
<script type="text/babel" src="src/combat.jsx"></script>
<script type="text/babel" src="src/screens.jsx"></script>
<script type="text/babel" src="src/design-canvas.jsx"></script>

<script type="text/babel" data-presets="react">
const P = window.PAL;

function Notes() {
  return (
    <div style={{
      background: P.boxBorder, color:'#fff',
      padding: 28, fontFamily:'"Pixelify Sans", monospace',
      width: 800, lineHeight: 1.6, fontSize: 14,
      boxShadow:`inset 0 0 0 3px ${P.boxBorderHi}`,
    }}>
      <div style={{
        fontFamily:'"Press Start 2P", monospace',
        fontSize: 18, marginBottom: 14, letterSpacing: 2, color:'#fcd848',
      }}>POKESPIRE</div>
      <div style={{ fontSize: 13, color:'#cbd4f0', marginBottom: 18 }}>
        A roguelike deckbuilder where every card is a creature's ability.<br/>
        Capture creatures during a run; bring any captured creature into<br/>
        the next run as your starter. GBA-era aesthetic, original world.
      </div>

      <div style={{
        display:'grid', gridTemplateColumns:'1fr 1fr', gap: 24,
        fontSize: 12, color:'#cbd4f0',
      }}>
        <div>
          <div style={{ color:'#fcd848', marginBottom: 6, fontWeight: 700, letterSpacing: 1 }}>SYSTEM</div>
          · Sprites: 14×14 with per-creature 5-color palettes<br/>
          · UI: white textbox + blue-tube border (rounded by clipPath)<br/>
          · Type chips: Ember · Tide · Flora · Spark · Mind · Umbra<br/>
          · Fonts: Press Start 2P (logo) + Pixelify Sans (body)
        </div>
        <div>
          <div style={{ color:'#fcd848', marginBottom: 6, fontWeight: 700, letterSpacing: 1 }}>HOW TO PLAY THE COMBAT DEMO</div>
          · Click cards to play — costs energy<br/>
          · END TURN to let the foe act (intent shown over its head)<br/>
          · Whittle foe to ≤ 40% HP, then play CAPTURE ORB<br/>
          · RESET to restart the encounter
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas title="POKESPIRE / DESIGN BOARD" initialZoom={0.55}>
      <DCSection id="overview" title="Overview">
        <DCArtboard id="notes" label="Project brief"
          width={800} height={300}>
          <Notes />
        </DCArtboard>
      </DCSection>

      <DCSection id="flow" title="Player flow — title → spire → combat → reward">
        <DCArtboard id="title" label="Title screen"
          width={480} height={560}>
          <TitleScreen width={480} height={560} />
        </DCArtboard>

        <DCArtboard id="starter" label="Starter select"
          width={760} height={560}>
          <StarterSelect width={760} height={560} />
        </DCArtboard>

        <DCArtboard id="map" label="Spire map"
          width={560} height={720}>
          <MapScreen width={560} height={720} />
        </DCArtboard>
      </DCSection>

      <DCSection id="combat" title="Combat — playable · switch creatures · STAB & type chart · live capture %">
        <DCArtboard id="combat-scene" label="Combat · CLICK cards to play · CLICK party slots to SWITCH (costs 1 NRG)"
          width={920} height={640}>
          <CombatScene width={920} height={640} enemyId="rootlet" />
        </DCArtboard>

        <DCArtboard id="combat-2" label="Combat · vs CINDERBAT — try switching to Brookpup for type advantage"
          width={920} height={640}>
          <CombatScene width={920} height={640} enemyId="cinderbat" />
        </DCArtboard>
      </DCSection>

      <DCSection id="meta" title="Post-combat & meta">
        <DCArtboard id="reward" label="Card reward"
          width={680} height={560}>
          <RewardScreen width={680} height={560} />
        </DCArtboard>

        <DCArtboard id="dex" label="Dex — captured creatures"
          width={760} height={560}>
          <DexScreen width={760} height={560} />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
